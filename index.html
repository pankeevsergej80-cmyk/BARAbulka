    <style>

            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .fira-font {
            font-family: 'Fira Sans', sans-serif;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-align: center;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Иконка техподдержки вверху */
        .support-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 10;
        }

        .header-section {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('1000070798.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .top-image {
            width: 150px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .brand-text {
            font-size: 32px;
            margin-bottom: 25px;
            animation: fadeInDown 1s ease-out;
        }

        .btn-style {
            background: linear-gradient(135deg, #001f3f, #0074D9);
            color: white;
            padding: 18px 45px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 20px;
            transition: transform 0.1s;
            display: inline-block;
        }

        .btn-style:active { transform: scale(0.9); }

        .gameplay-section {
            padding: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111;
        }

        .section-title {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .photo-card {
            width: 90%;
            margin-bottom: 45px;
            text-align: center;
        }

        .photo-card img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #333;
            transition: transform 0.2s;
        }

        .photo-card img:active { transform: scale(0.96); }

        .photo-caption {
            font-size: 18px;
            margin-top: 15px;
            display: block;
        }

        /* Блок ТОПы */
        .tops-section {
            background: #000;
            padding: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 2px solid #222;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #222;
            background: #000;
        }

        .social-links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-link {
            color: #00aaff;
            text-decoration: none;
            font-size: 20px;
        }
    </style>
</head>
