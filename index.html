<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARAbulka - TM Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .fira-font {
            font-family: 'Fira Sans', sans-serif;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-align: center;
        }

        /* АНИМАЦИИ ПОЯВЛЕНИЯ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-appear {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0; /* Чтобы не мелькало до начала анимации */
        }

        /* Задержки для поэтапного появления */
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* Иконка техподдержки */
        .support-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 100;
            transition: transform 0.1s;
        }
        .support-icon:active { transform: scale(0.8); }

        .header-section {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('1000070798.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .top-image {
            width: 150px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .brand-text {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .btn-style {
            background: linear-gradient(135deg, #001f3f, #0074D9);
            color: white;
            padding: 18px 45px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 20px;
            transition: transform 0.1s;
            display: inline-block;
        }

        /* Анимация клика для всех кнопок */
        .btn-style:active { transform: scale(0.9); }

        .gameplay-section {
            padding: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111;
        }

        .section-title {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .photo-card {
            width: 90%;
            margin-bottom: 45px;
            text-align: center;
            transition: transform 0.2s;
        }

        .photo-card img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #333;
        }

        /* Анимация клика для фото */
        .photo-card:active { transform: scale(0.95); }

        .photo-caption {
            font-size: 18px;
            margin-top: 15px;
            display: block;
        }

        .tops-section {
            background: #000;
            padding: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 2px solid #222;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #222;
            background: #000;
        }

        .social-link {
            color: #00aaff;
            text-decoration: none;
            font-size: 20px;
            display: block;
            margin-bottom: 15px;
            transition: transform 0.1s;
        }
        .social-link:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <section class="header-section">
        <a href="mailto:tmstudio496@gmail.com" class="support-icon animate-appear">
            <span style="font-size: 24px;">🎧</span>
        </a>

        <img src="1000065164.png" class="top-image animate-appear delay-1" alt="Logo">
        <div class="brand-text fira-font animate-appear delay-2">BARAbulka</div>
        
        <a href="https://disk.yandex.ru/d/MKApcbyH-z7WHg" class="btn-style fira-font animate-appear delay-3">СКАЧАТЬ</a>
    </section>

    <main class="gameplay-section">
        <h2 class="section-title fira-font animate-appear">Геймплей</h2>

        <div class="photo-card animate-appear">
            <img src="1000070797.png">
            <span class="photo-caption fira-font">Приятный интерфейс.</span>
        </div>

        <div class="photo-card animate-appear">
            <img src="1000070772.png">
            <span class="photo-caption fira-font">Бегай от быка.</span>
        </div>

        <div class="photo-card animate-appear">
            <img src="1000070786.jpg">
            <span class="photo-caption fira-font">Смотри крутые анимации скримеров.</span>
        </div>

        <div class="photo-card animate-appear">
            <img src="1000070797.png">
            <span class="photo-caption fira-font">Испытай свою удачу.</span>
        </div>

        <div class="photo-card animate-appear">
            <img src="1000070772.png">
            <span class="photo-caption fira-font">Пройди все уровни.</span>
        </div>

        <div class="photo-card animate-appear">
            <img src="1000070786.jpg">
            <span class="photo-caption fira-font">Стань легендой BARAbulka.</span>
        </div>
    </main>

    <section class="tops-section">
        <div class="photo-card animate-appear">
            <img src="1000070798.png">
            <span class="photo-caption fira-font" style="margin-bottom: 25px; padding: 0 10px;">
                Хочешь попасть в Топы? Скорее пиши письмо с твоими очками ником и доказательствами.
            </span>
            <a href="mailto:tmstudio496@gmail.com?subject=Попадание в ТОП&body=Мой ник: %0AМои очки: %0AДоказательства: " class="btn-style fira-font">Написать</a>
        </div>
    </section>

    <footer>
        <div class="animate-appear">
            <a href="https://t.me/barabulka_tmstudio" class="social-link fira-font">Telegram</a>
            <a href="https://www.tiktok.com/@tmstudio_official?_r=1&_t=ZS-94zD7Ez9Vu0" class="social-link fira-font">TikTok</a>
            <div class="fira-font" style="font-size: 14px; opacity: 0.4; margin-top: 20px;">Tm Studio</div>
        </div>
    </footer>

    <script>
        // Скрипт для запуска анимации при прокрутке
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = "1";
                    entry.target.classList.add('animate-appear');
                }
            });
        });

        document.querySelectorAll('.animate-appear').forEach((el) => observer.observe(el));
    </script>

</body>
</html>
